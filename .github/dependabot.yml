# This fork takes dependency changes from upstream. Dependabot is kept quiet:
# one grouped minor/patch PR per ecosystem per month, direct dependencies only,
# and no major-version updates.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    groups:
      actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: 'docker'
    directories:
      - '/services/bsky'
      - '/services/bsync'
      - '/services/ozone'
      - '/services/pds'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    groups:
      # All four services pin the same node:*-alpine base image; group them so
      # a base image bump is one PR instead of four near-identical ones.
      base-images:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
